<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grow Up — Fantasy Football</title>
<style>
  :root{
    --bg:#0a0d14;
    --surface:#131928;
    --surface-2:#1b2338;
    --surface-3:#232c46;
    --border:#262f47;
    --accent:#22c55e;
    --accent-dim:#123d22;
    --text:#f4f6fb;
    --text-2:#a3aec6;
    --text-3:#6c7690;
    --win:#4fbf8f;
    --loss:#e0574a;
    --radius:14px;
    --radius-sm:9px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);height:100%;overflow:hidden;overscroll-behavior:none;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{display:none;}

  #viewport{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;z-index:1;}
  #track{display:flex;height:100%;width:300%;}
  .panel{width:100vw;height:100%;flex:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
  .panel-inner{max-width:560px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom));}

  .topbar{
    padding:20px 0 14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;flex-direction:column;}
  .brand .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--accent);font-weight:700;text-transform:uppercase;}
  .brand .title{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-top:2px;}
  .brand .sub{font-size:12px;color:var(--text-3);margin-top:2px;}

  .section{margin-top:22px;}
  .section-title{
    font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--text-3);margin:0 0 10px 2px;display:flex;align-items:center;justify-content:space-between;
  }

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat-card{
    background:var(--surface);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;
    border:1px solid var(--border);
  }
  .stat-card .num{font-size:20px;font-weight:800;color:var(--text);}
  .stat-card .lbl{font-size:10px;color:var(--text-3);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;
  }

  .champion-card{
    background:linear-gradient(180deg,var(--surface-3),var(--surface));
    border:1px solid var(--accent-dim);border-radius:var(--radius);padding:18px 16px;
    display:flex;align-items:center;gap:14px;
  }
  .champion-card .ring{
    width:52px;height:52px;border-radius:50%;background:var(--accent);color:#04140a;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;
  }
  .champion-card .info .yr{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:0.5px;}
  .champion-card .info .name{font-size:19px;font-weight:800;margin-top:1px;}
  .champion-card .info .meta{font-size:12px;color:var(--text-2);margin-top:2px;}

  .rank-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
  .rank-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
  .rank-row:last-child{border-bottom:none;}
  .rank-row .pos{
    width:22px;height:22px;border-radius:50%;background:var(--surface-3);color:var(--text-2);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;
  }
  .rank-row.gold .pos{background:var(--accent);color:#04140a;}
  .rank-row .rname{flex:1;font-size:14px;font-weight:600;}
  .rank-row .rval{font-size:14px;font-weight:800;color:var(--accent);}
  .rank-row .rsub{font-size:11px;color:var(--text-3);}

  .pillrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;}
  .pill{
    flex:none;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);
    font-size:13px;font-weight:700;color:var(--text-2);scroll-snap-align:start;
  }
  .pill.active{background:var(--accent);color:#04140a;border-color:var(--accent);}

  .mgr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mgr-chip{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .mgr-chip .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#0a0d14;}
  .mgr-chip .nm{font-size:12px;font-weight:700;}
  .mgr-chip.active{border-color:var(--accent);}

  .podium{display:flex;gap:8px;align-items:flex-end;margin-bottom:14px;}
  .podium .slot{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;}
  .podium .slot.first{background:linear-gradient(180deg,var(--surface-3),var(--surface));border-color:var(--accent-dim);padding-top:16px;}
  .podium .medal{font-size:11px;font-weight:800;color:var(--text-3);}
  .podium .slot.first .medal{color:var(--accent);}
  .podium .pname{font-size:13px;font-weight:800;margin-top:4px;}

  .badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .badge{
    flex:1;min-width:100px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .badge .blbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;}
  .badge .bval{font-size:14px;font-weight:800;margin-top:3px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
  .table-scroll{overflow-x:auto;}
  th{
    text-align:left;padding:9px 8px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--text-3);background:var(--surface-2);white-space:nowrap;font-weight:700;
  }
  td{padding:9px 8px;border-top:1px solid var(--border);white-space:nowrap;font-weight:600;}
  tr.me td{background:rgba(245,165,36,0.06);}
  .num-cell{color:var(--text-2);font-weight:500;}
  .win-txt{color:var(--win);}
  .loss-txt{color:var(--loss);}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;margin-left:4px;}
  .tag.gold{background:var(--accent-dim);color:var(--accent);}

  .record-card{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
  .record-card:last-child{border-bottom:none;}
  .record-card .rc-l .rc-t{font-size:12px;color:var(--text-2);}
  .record-card .rc-l .rc-n{font-size:14px;font-weight:800;margin-top:2px;}
  .record-card .rc-r{font-size:16px;font-weight:800;color:var(--accent);text-align:right;}
  .record-card .rc-r .rc-s{display:block;font-size:10px;color:var(--text-3);font-weight:600;}

  .manager-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .manager-header .av-lg{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#0a0d14;flex:none;}
  .manager-header .mh-name{font-size:22px;font-weight:800;}
  .manager-header .mh-sub{font-size:12px;color:var(--text-3);margin-top:2px;}

  .empty{padding:40px 10px;text-align:center;color:var(--text-3);font-size:13px;}

  nav.bottomnav{
    position:fixed;left:0;right:0;bottom:0;background:rgba(17,22,36,0.94);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,0.07);display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;z-index:20;
    box-shadow:0 -10px 28px rgba(0,0,0,0.5),0 -1px 0 rgba(255,255,255,0.03);
  }
  nav.bottomnav .nitem{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--text-3);
    font-size:10.5px;font-weight:700;border:none;background:none;
  }
  nav.bottomnav .nitem.active{color:var(--accent);}
  nav.bottomnav svg{width:22px;height:22px;}
  @media (min-width:560px){
    nav.bottomnav{border-radius:16px 16px 0 0;bottom:0;}
  }
  h2.page-title{font-size:20px;font-weight:800;margin:4px 0 16px;}
</style>
</head>

function pct(v){ return v.toFixed(1)+'%'; }
function num(v){ return (v===null||v===undefined) ? '—' : v; }
function fmt1(v){ return (v===null||v===undefined) ? '—' : Number(v).toFixed(1); }
function fmtPts(v){ return (v===null||v===undefined) ? '—' : Number(v).toLocaleString(undefined,{maximumFractionDigits:1}); }
function initials(name){ return name.slice(0,2).toUpperCase(); }
function avatarStyle(name){ const c = DATA.managers[name] ? DATA.managers[name].color : '#22c55e'; return 'background:'+c+';'; }

function sortedManagerNames(){
  return Object.keys(DATA.managers).sort((a,b)=>{
    const ma=DATA.managers[a], mb=DATA.managers[b];
    if(mb.champs!==ma.champs) return mb.champs-ma.champs;
    if(mb.winPct!==ma.winPct) return mb.winPct-ma.winPct;
    return a.localeCompare(b);
  });
}

function alphabeticalManagerNames(){
  return Object.keys(DATA.managers).sort((a,b)=>a.localeCompare(b));
}

const PAGE_ORDER = ['home','seasons','managers'];
let curPage = 'home';
let curIndex = 0;
let lastYear = Math.max(...DATA.years);
let lastManagers = [];

const viewportEl = document.getElementById('viewport');
const trackEl = document.getElementById('track');
const panelPrev = document.getElementById('panel-prev');
const panelCur = document.getElementById('panel-cur');
const panelNext = document.getElementById('panel-next');

function vw(){ return viewportEl.clientWidth; }

function pageHTML(page){
  if(page==='home') return renderHome();
  if(page==='seasons') return renderSeasons(lastYear);
  if(page==='managers') return renderManagers(lastManagers);
  return '';
}
function wrapPanel(html){ return html ? '<div class="panel-inner">'+html+'</div>' : ''; }
function computeHash(page){
  if(page==='seasons') return '#/seasons/'+lastYear;
  if(page==='managers') return lastManagers.length ? '#/managers/'+lastManagers.map(encodeURIComponent).join(',') : '#/managers';
  return '#/home';
}

function paintPanels(){
  const prevName = PAGE_ORDER[curIndex-1];
  const nextName = PAGE_ORDER[curIndex+1];
  panelPrev.innerHTML = prevName ? wrapPanel(pageHTML(prevName)) : '';
  panelCur.innerHTML = wrapPanel(pageHTML(curPage));
  panelNext.innerHTML = nextName ? wrapPanel(pageHTML(nextName)) : '';
  attachSeasonPills();
  attachManagerChips();
  document.querySelectorAll('#bottomnav .nitem').forEach(b=>b.classList.toggle('active', b.dataset.go===curPage));
  if(curPage==='managers' && lastManagers.length){
    const detail = panelCur.querySelector('#manager-detail');
    if(detail && detail.scrollIntoView){
      requestAnimationFrame(()=>{ detail.scrollIntoView({behavior:'smooth', block:'start'}); });
    }
  }
}

function slideToIndex(targetIdx, targetPage){
  const dir = targetIdx > curIndex ? 1 : -1;
  const vwpx = vw();
  trackEl.style.transition = 'transform 280ms cubic-bezier(.22,.61,.36,1)';
  trackEl.style.transform = 'translateX('+(-(1+dir)*vwpx)+'px)';
  trackEl.addEventListener('transitionend', function onEnd(e){
    if(e.propertyName && e.propertyName!=='transform') return;
    trackEl.removeEventListener('transitionend', onEnd);
    curIndex = targetIdx; curPage = targetPage;
    trackEl.style.transition = 'none';
    paintPanels();
    trackEl.style.transform = 'translateX('+(-vwpx)+'px)';
  });
}

function handleHashChange(){
  const hash = location.hash.replace('#/','') || 'home';
  const parts = hash.split('/');
  let page = parts[0];
  if(PAGE_ORDER.indexOf(page)===-1) page = 'home';
  if(page==='seasons') lastYear = parts[1] ? Number(parts[1]) : lastYear;
  if(page==='managers') lastManagers = parts[1] ? parts[1].split(',').map(decodeURIComponent).filter(n=>DATA.managers[n]) : [];

  if(page===curPage){
    panelCur.innerHTML = wrapPanel(pageHTML(curPage));
    attachSeasonPills();
    attachManagerChips();
    if(curPage==='managers' && lastManagers.length){
      const detail = panelCur.querySelector('#manager-detail');
      if(detail && detail.scrollIntoView){
        requestAnimationFrame(()=>{ detail.scrollIntoView({behavior:'smooth', block:'start'}); });
      }
    }
    return;
  }

  const targetIdx = PAGE_ORDER.indexOf(page);
  if(Math.abs(targetIdx-curIndex)===1){
    slideToIndex(targetIdx, page);
  } else {
    curIndex = targetIdx; curPage = page;
    trackEl.style.transition = 'none';
    paintPanels();
    trackEl.style.transform = 'translateX('+(-vw())+'px)';
  }
}

function init(){
  const hash = location.hash.replace('#/','') || 'home';
  const parts = hash.split('/');
  let page = parts[0];
  if(PAGE_ORDER.indexOf(page)===-1) page = 'home';
  if(page==='seasons') lastYear = parts[1] ? Number(parts[1]) : lastYear;
  if(page==='managers') lastManagers = parts[1] ? parts[1].split(',').map(decodeURIComponent).filter(n=>DATA.managers[n]) : [];
  curPage = page; curIndex = PAGE_ORDER.indexOf(page);
  trackEl.style.transition = 'none';
  paintPanels();
  trackEl.style.transform = 'translateX('+(-vw())+'px)';
}

let drag = null;
viewportEl.addEventListener('touchstart', (e)=>{
  const t = e.touches[0];
  if(t.target.closest('.table-scroll, .pillrow')){ drag = null; return; }
  drag = { startX:t.clientX, startY:t.clientY, locked:null, lastDx:0, vwpx:vw() };
}, {passive:true});

viewportEl.addEventListener('touchmove', (e)=>{
  if(!drag) return;
  const t = e.touches[0];
  const dx = t.clientX - drag.startX;
  const dy = t.clientY - drag.startY;
  if(drag.locked===null){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    drag.locked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if(drag.locked==='v'){ drag = null; return; }
  }
  if(drag.locked==='h'){
    if(e.cancelable) e.preventDefault();
    let clamped = dx;
    if(curIndex===0) clamped = Math.min(dx,0);
    if(curIndex===PAGE_ORDER.length-1) clamped = Math.max(dx,0);
    trackEl.style.transition = 'none';
    trackEl.style.transform = 'translateX('+(-drag.vwpx+clamped)+'px)';
    drag.lastDx = clamped;
  }
}, {passive:false});

viewportEl.addEventListener('touchend', ()=>{
  if(!drag || drag.locked!=='h'){ drag = null; return; }
  const dx = drag.lastDx;
  const vwpx = drag.vwpx;
  const THRESHOLD = Math.min(100, vwpx*0.22);
  let targetIdx = curIndex;
  if(dx <= -THRESHOLD && curIndex < PAGE_ORDER.length-1) targetIdx = curIndex+1;
  else if(dx >= THRESHOLD && curIndex > 0) targetIdx = curIndex-1;

  trackEl.style.transition = 'transform 260ms cubic-bezier(.22,.61,.36,1)';
  if(targetIdx !== curIndex){
    const dir = targetIdx > curIndex ? 1 : -1;
    trackEl.style.transform = 'translateX('+(-(1+dir)*vwpx)+'px)';
    trackEl.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName && e.propertyName!=='transform') return;
      trackEl.removeEventListener('transitionend', onEnd);
      curIndex = targetIdx; curPage = PAGE_ORDER[targetIdx];
      trackEl.style.transition = 'none';
      paintPanels();
      trackEl.style.transform = 'translateX('+(-vwpx)+'px)';
      const h = computeHash(curPage);
      if(location.hash !== h) location.hash = h;
    });
  } else {
    trackEl.style.transform = 'translateX('+(-vwpx)+'px)';
  }
  drag = null;
}, {passive:true});

window.addEventListener('resize', ()=>{
  trackEl.style.transition = 'none';
  trackEl.style.transform = 'translateX('+(-vw())+'px)';
});

  const champName = latestSeason.champion.join(' & ');

  const champsBoard = names.filter(n=>DATA.managers[n].champs>0).slice(0,5);
  const winPctBoard = [...names].sort((a,b)=>DATA.managers[b].winPct-DATA.managers[a].winPct).slice(0,5);

  const r = DATA.records;

  return `
    <div class="topbar">
      <div class="brand">
        <span class="eyebrow">Fantasy Football</span>
        <span class="title">Grow Up</span>
        <span class="sub">${Math.min(...DATA.years)}–${Math.max(...DATA.years)}</span>
      </div>
    </div>
    <div id="home-content">
      <div class="stat-grid">
        <div class="stat-card"><div class="num">${totalSeasons}</div><div class="lbl">Seasons</div></div>
        <div class="stat-card"><div class="num">${totalManagers}</div><div class="lbl">Managers</div></div>
        <div class="stat-card"><div class="num">12</div><div class="lbl">Teams/Year</div></div>
      </div>

      <div class="section">
        <div class="section-title">Reigning champion</div>
        <a class="champion-card" href="#/seasons/${latestYear}">
          <div class="ring">${initials(latestSeason.champion[0])}</div>
          <div class="info">
            <div class="yr">${latestYear} CHAMPION</div>
            <div class="name">${champName}</div>
            <div class="meta">Scoring champ: ${latestSeason.scoringChamp} · Reg. season: ${latestSeason.regSznChamp}</div>
          </div>
        </a>
      </div>

      <div class="section">
        <div class="section-title">Hall of fame <span style="font-weight:500;text-transform:none;color:var(--text-3)">by championships</span></div>
        <div class="rank-list">
          ${champsBoard.map((n,i)=>`
            <a class="rank-row ${i===0?'gold':''}" href="#/managers/${encodeURIComponent(n)}">
              <div class="pos">${i+1}</div>
              <div class="rname">${n}</div>
              <div class="rsub">${DATA.managers[n].seasons} szns</div>
              <div class="rval">${DATA.managers[n].champs}&nbsp;🏆</div>
            </a>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title">Best win % <span style="font-weight:500;text-transform:none;color:var(--text-3)">min. 1 season</span></div>
        <div class="rank-list">
          ${winPctBoard.map((n,i)=>`
            <a class="rank-row ${i===0?'gold':''}" href="#/managers/${encodeURIComponent(n)}">
              <div class="pos">${i+1}</div>
              <div class="rname">${n}</div>
              <div class="rsub">${DATA.managers[n].wins}-${DATA.managers[n].losses}</div>
              <div class="rval">${pct(DATA.managers[n].winPct)}</div>
            </a>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title">League records</div>
        <div class="card" style="padding:0;">
          <div class="record-card">
            <div class="rc-l"><div class="rc-t">Highest scoring season</div><div class="rc-n">${r.highestPF.manager} · ${r.highestPF.year}</div></div>
            <div class="rc-r">${fmtPts(r.highestPF.pf)}</div>
          </div>
          <div class="record-card">
            <div class="rc-l"><div class="rc-t">Most wins in a season</div><div class="rc-n">${r.mostWins.manager} · ${r.mostWins.year}</div></div>
            <div class="rc-r">${r.mostWins.wins}-${r.mostWins.losses}</div>
          </div>
          <div class="record-card">
            <div class="rc-l"><div class="rc-t">Best point differential</div><div class="rc-n">${r.bestPointDiff.manager} · ${r.bestPointDiff.year}</div></div>
            <div class="rc-r">+${fmtPts(r.bestPointDiff.diff)}</div>
          </div>
          <div class="record-card">
            <div class="rc-l"><div class="rc-t">Worst point differential</div><div class="rc-n">${r.worstPointDiff.manager} · ${r.worstPointDiff.year}</div></div>
            <div class="rc-r">${fmtPts(r.worstPointDiff.diff)}</div>
          </div>
          <div class="record-card">
            <div class="rc-l"><div class="rc-t">Lowest scoring season</div><div class="rc-n">${r.lowestPF.manager} · ${r.lowestPF.year}</div></div>
            <div class="rc-r">${fmtPts(r.lowestPF.pf)}</div>
          </div>
        </div>
      </div>
      <div style="height:8px"></div>
    </div>
  `;
}

function attachSeasonPills(){
  document.querySelectorAll('.pill[data-year]').forEach(p=>{
    p.addEventListener('click', ()=>{ location.hash = '#/seasons/'+p.dataset.year; });
  });
}

function renderSeasons(year){
  const s = DATA.seasons[year];
  const years = [...DATA.years].sort((a,b)=>b-a);
  const pills = years.map(y=>`<button class="pill ${y===year?'active':''}" data-year="${y}">${y}</button>`).join('');

  const rows = s.standings.map(row=>{
    const mgr = DATA.managers[row.manager];
    const names = row.managers.map(m=>`<a href="#/managers/${encodeURIComponent(m)}" style="color:inherit">${m}</a>`).join(' <span style="color:var(--text-3)">&amp;</span> ');
    return `<tr>
      <td>${row.standing}${row.standing===1?' 🏆':''}</td>
      <td>${names}</td>
      <td class="${row.wins>row.losses?'win-txt':'loss-txt'}">${row.wins}-${row.losses}</td>
      <td class="num-cell">${fmtPts(row.pf)}</td>
      <td class="num-cell">${fmtPts(row.pa)}</td>
      <td class="num-cell">${num(row.draftPos)}</td>
    </tr>`;
  }).join('');

  return `
    <div class="topbar">
      <div class="brand">
        <span class="eyebrow">Season</span>
        <span class="title">${year}</span>
        <span class="sub">${s.platform} · ${s.totalTeams} teams · ${s.playoffTeams} made playoffs</span>
      </div>
    </div>
    <div class="pillrow">${pills}</div>

    <div class="podium">
      <div class="slot"><div class="medal">🥈 2ND</div><div class="pname">${s.runnerUp.join(' & ')}</div></div>
      <div class="slot first"><div class="medal">🏆 CHAMPION</div><div class="pname">${s.champion.join(' & ')}</div></div>
      <div class="slot"><div class="medal">🥉 3RD</div><div class="pname">${s.third.join(' & ')}</div></div>
    </div>

    <div class="badge-row">
      <div class="badge"><div class="blbl">💯 Scoring champ</div><div class="bval">${s.scoringChamp||'—'}</div></div>
      <div class="badge"><div class="blbl">📈 Reg. season champ</div><div class="bval">${s.regSznChamp||'—'}</div></div>
      <div class="badge"><div class="blbl">💩 Wooden spoon</div><div class="bval">${s.lastPlace||'—'}</div></div>
    </div>

    <div class="section-title">Final standings</div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead><tr><th>#</th><th>Manager</th><th>Record</th><th>PF</th><th>PA</th><th>Draft</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div style="height:8px"></div>
  `;
}

function attachManagerChips(){
  document.querySelectorAll('.mgr-chip[data-mgr]').forEach(c=>{
    c.addEventListener('click', ()=>{
      const n = c.dataset.mgr;
      const hash = location.hash.replace('#/managers','').replace(/^\//,'');
      let current = hash ? hash.split(',').map(decodeURIComponent).filter(x=>DATA.managers[x]) : [];
      let next;
      if(current.includes(n)){
        next = current.filter(x=>x!==n);
      } else if(current.length===0){
        next = [n];
      } else if(current.length===1){
        next = [current[0], n];
      } else {
        next = [current[0], n];
      }
      location.hash = next.length ? '#/managers/'+next.map(encodeURIComponent).join(',') : '#/managers';
    });
  });
}

function renderManagerDetail(selected){
  const m = DATA.managers[selected];
  const yearsRows = m.years.map(y=>{
    const tags = [];
    if(y.regSznChamp) tags.push('<span class="tag gold">REG</span>');
    if(y.scoringChamp) tags.push('<span class="tag gold">PTS</span>');
    const co = y.coManagedWith ? `<div style="font-size:10px;font-weight:600;color:var(--text-3);margin-top:2px;">with <a href="#/managers/${encodeURIComponent(y.coManagedWith)}" style="color:var(--text-2);text-decoration:underline;">${y.coManagedWith}</a></div>` : '';
    return `<tr class="${y.standing===1?'me':''}">
      <td>${y.year}${co}</td>
      <td>${y.standing}${y.standing===1?' 🏆':''}</td>
      <td class="${y.wins>y.losses?'win-txt':'loss-txt'}">${y.wins}-${y.losses}</td>
      <td class="num-cell">${fmtPts(y.pf)}</td>
      <td>${y.playoffs?'Yes':'No'}${tags.join('')}</td>
    </tr>`;
  }).join('');

  return `
    <div class="manager-header">
      <div class="av-lg" style="${avatarStyle(selected)}">${initials(selected)}</div>
      <div>
        <div class="mh-name">${selected}</div>
        <div class="mh-sub">${m.seasons} seasons played · ${m.wins}-${m.losses} all-time</div>
      </div>
    </div>

    <div class="badge-row">
      <div class="badge"><div class="blbl">Championships</div><div class="bval">${m.champs}</div></div>
      <div class="badge"><div class="blbl">Win %</div><div class="bval">${pct(m.winPct)}</div></div>
      <div class="badge"><div class="blbl">Avg finish</div><div class="bval">${fmt1(m.avgFinish)}</div></div>
    </div>
    <div class="badge-row">
      <div class="badge"><div class="blbl">Scoring titles</div><div class="bval">${m.scoringTitles}</div></div>
      <div class="badge"><div class="blbl">Reg. szn titles</div><div class="bval">${m.regSznTitles}</div></div>
      <div class="badge"><div class="blbl">Playoffs made</div><div class="bval">${m.playoffs}</div></div>
    </div>
    <div class="badge-row">
      <div class="badge"><div class="blbl">Avg points/szn</div><div class="bval">${fmtPts(m.avgPF)}</div></div>
      <div class="badge"><div class="blbl">Avg draft pos</div><div class="bval">${fmt1(m.avgDraftPos)}</div></div>
      <div class="badge"><div class="blbl">Last places</div><div class="bval">${m.lastPlaces}</div></div>
    </div>

    <div class="section-title">Season by season</div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead><tr><th>Year</th><th>Finish</th><th>Record</th><th>PF</th><th>Playoffs</th></tr></thead>
          <tbody>${yearsRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

const COMPARE_ROWS = [
  {label:'Championships', key:'champs', dir:'high', fmt:num},
  {label:'Win %', key:'winPct', dir:'high', fmt:pct},
  {label:'Avg finish', key:'avgFinish', dir:'low', fmt:fmt1},
  {label:'Scoring titles', key:'scoringTitles', dir:'high', fmt:num},
  {label:'Reg. szn titles', key:'regSznTitles', dir:'high', fmt:num},
  {label:'Playoffs made', key:'playoffs', dir:'high', fmt:num},
  {label:'Avg points/szn', key:'avgPF', dir:'high', fmt:fmtPts},
  {label:'Last places', key:'lastPlaces', dir:'low', fmt:num},
  {label:'Seasons played', key:'seasons', dir:null, fmt:num},
];

function renderManagerCompare(nameA, nameB){
  const a = DATA.managers[nameA], b = DATA.managers[nameB];
  const rows = COMPARE_ROWS.map(r=>{
    const av = a[r.key], bv = b[r.key];
    let aWin=false, bWin=false;
    if(r.dir==='high' && av!==bv){ aWin = av>bv; bWin = bv>av; }
    if(r.dir==='low' && av!==bv){ aWin = av<bv; bWin = bv<av; }
    return `<div style="display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);">
      <div style="flex:1;text-align:right;font-size:14px;font-weight:800;color:${aWin?'var(--accent)':'var(--text-2)'};">${r.fmt(av)}</div>
      <div style="width:110px;text-align:center;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;padding:0 8px;">${r.label}</div>
      <div style="flex:1;text-align:left;font-size:14px;font-weight:800;color:${bWin?'var(--accent)':'var(--text-2)'};">${r.fmt(bv)}</div>
    </div>`;
  }).join('');

  return `
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;">
      <a href="#/managers/${encodeURIComponent(nameA)}" style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div class="av-lg" style="${avatarStyle(nameA)}">${initials(nameA)}</div>
        <div style="font-size:13px;font-weight:800;">${nameA}</div>
      </a>
      <div style="font-size:12px;font-weight:800;color:var(--text-3);">VS</div>
      <a href="#/managers/${encodeURIComponent(nameB)}" style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div class="av-lg" style="${avatarStyle(nameB)}">${initials(nameB)}</div>
        <div style="font-size:13px;font-weight:800;">${nameB}</div>
      </a>
    </div>
    <div class="table-wrap" style="overflow:hidden;">
      ${rows}
    </div>
    <div class="empty" style="padding:16px 10px 0;">Tap a manager in the grid above to swap them in, or tap a selected one again to remove them</div>
  `;
}

function renderManagers(selected){
  const names = alphabeticalManagerNames();
  const grid = names.map(n=>`
    <div class="mgr-chip ${selected.includes(n)?'active':''}" data-mgr="${n}">
      <div class="av" style="${avatarStyle(n)}">${initials(n)}</div>
      <div class="nm">${n}</div>
    </div>`).join('');

  const header = `
    <div class="topbar">
      <div class="brand">
        <span class="eyebrow">Managers</span>
        <span class="title">${DATA.leagueName}</span>
        <span class="sub">${selected.length===2 ? 'Head-to-head comparison' : 'Tap a manager for career stats, or pick two to compare'}</span>
      </div>
    </div>
    <div class="mgr-grid">${grid}</div>
  `;

  if(selected.length===0){
    return header + `<div class="empty">Select a manager above to see their stats</div>`;
  }

  if(selected.length===1){
    return header + `<div class="section" id="manager-detail">${renderManagerDetail(selected[0])}</div><div style="height:8px"></div>`;
  }

  return header + `<div class="section" id="manager-detail">${renderManagerCompare(selected[0], selected[1])}</div><div style="height:8px"></div>`;
}

document.querySelectorAll('#bottomnav .nitem').forEach(b=>{
  b.addEventListener('click', ()=>{ location.hash = '#/'+b.dataset.go; });
});
window.addEventListener('hashchange', handleHashChange);

init();
</script>
</body>
</html>
